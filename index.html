<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="shortcut icon" href="./images/task.png" type="image/x-icon">
    <title>To-Do-List</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="maindiv">
    <!--heading-->
<div class="heading">
    My Tasks
</div>

<!--input-->
<div class="input">
    <input type="text" id="inputfield" placeholder="Add a new task" required >
</div>


<!--addbutton-->
<div class="button">
    <button id="addtaskbutton">Add</button>
</div>

<div class="showstats">
  <p id="totalvalue">Total: <span id="total"></span></p>
  <p id="completedvalue">Completed: <span id="completed"></span></p>
  <p id="remianingvalue">Remaining: <span id="remianing"></span></p>

</div>

<div id="tasklist">

</div>

</div>
    
<script src="Index.js"></script>
</body>
</html>
